<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohort Report Summary — {{ module_code }}</title>
    <style>
        /* Base Resets & Layout Envelope */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a2e;
            font-size: 14px;
            line-height: 1.5;
            background: #f0f2f5;
            padding: 32px 16px;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 32px;
        }

        /* Shared block style sheet variables */
        {% include "css/feedback_blocks.css" %}

        /* Dashboard specific overrides */
        {% include "css/cohort_report_download.css" %}
    </style>
</head>
<body>
    <div class="page">
        {% include "cohort_report/_report_content.html" %}

        <!-- Footer -->
        <footer class="disclaimer" style="font-size: 10px; color: #8892b0; text-align: center; padding: 20px 32px; border-top: 1px solid #e8e8e8; background: #fafafa; margin-top: 40px; border-radius: 8px;">
            This document is generated by the Feedback Portal. It contains aggregate statistical data for class performance review.
        </footer>
    </div>
</body>
</html>
