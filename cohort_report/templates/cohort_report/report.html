{% extends base_template %}
{% load static_helpers %}

{% block title %}Cohort Summary - {{ module_code }}{% endblock %}

{% block extra_css %}
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
    rel="stylesheet">
<style>
    {% inline_static "core/css/brand_design.css" %}
    {% inline_static "cohort_report/css/cohort_report.css" %}
</style>
{% if active_theme %}
<style>
    :root {
        --brand-primary: {{ active_theme.brand_primary }};
        --brand-primary-dark: {{ active_theme.brand_primary_dark }};
        --brand-primary-light: {{ active_theme.brand_primary_light }};
        --brand-accent: {{ active_theme.brand_accent }};
    }
</style>
{% endif %}
{% endblock %}

{% block content %}
<div class="container py-4">
    {% include "cohort_report/_report_content.html" %}
</div>
{% endblock %}
